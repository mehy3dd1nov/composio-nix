name: Check and PR Composio CLI Updates

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, unstable]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run nix-update via passthru.updateScript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run nixpkgs#nix-update -- --flake --use-update-script composio-cli

      - name: Test Build & Protocol Handshake
        run: |
          nix flake check
          nix build .#composio-cli
          ./result/bin/composio --version
          ./result/bin/composio --help
          ./result/bin/codex-acp --help
          RESP=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | ./result/bin/claude-code-acp)
          echo "ACP Handshake: $RESP"
          echo "$RESP" | grep -q "claude-code-acp"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ matrix.branch }}
          branch: chore/upstream-update-${{ matrix.branch }}
          commit-message: "chore(release): bump composio-cli on ${{ matrix.branch }}"
          title: "🚀 composio-cli: bump version on ${{ matrix.branch }}"
          body: |
            An upstream update was detected for **Composio CLI** on `${{ matrix.branch }}`.
            
            - Updated `package.nix` SRI hashes across Linux and Apple Silicon
            - Verified multi-platform flake evaluation
            - Smoke-tested CLI and Agent Client Protocol (ACP) handshakes
          delete-branch: true
