name: Update Upstream

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [main, unstable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/update.sh
          ./scripts/update.sh

      - name: Test Build & ACP Protocol Verification
        run: |
          nix flake check
          nix build .#composio-cli
          ./result/bin/composio --version
          ./result/bin/composio --help
          ./result/bin/codex-acp --help
          RESP=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | ./result/bin/claude-code-acp)
          echo "ACP Handshake: $RESP"
          echo "$RESP" | grep -q "claude-code-acp"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ matrix.branch }}
          branch: chore/upstream-update-${{ matrix.branch }}
          commit-message: "chore(release): bump composio-cli on ${{ matrix.branch }}"
          title: "chore(release): bump composio-cli on ${{ matrix.branch }}"
          body: |
            Automated daily update for `@composio/cli` on `${{ matrix.branch }}`.
            - Updated `package.nix` SRI hashes across all platforms
            - Ingested latest `composio-skill.zip`
            - Built and tested execution via Nix
          delete-branch: true
