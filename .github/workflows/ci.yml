name: CI

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Flake Check
        run: nix flake check

      - name: Build Package
        run: nix build .#composio-cli

      - name: Test Composio CLI Execution
        run: |
          ./result/bin/composio --version
          ./result/bin/composio --help

      - name: Test Codex ACP Adapter Execution
        run: |
          ./result/bin/codex-acp --help

      - name: Test Claude Code ACP Protocol Handshake
        run: |
          RESP=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | ./result/bin/claude-code-acp)
          echo "Handshake response: $RESP"
          echo "$RESP" | grep -q "claude-code-acp"
